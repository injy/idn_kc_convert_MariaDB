## Quota backend — restored after Dovecot 2.4 upgrade orphaned the config.
##
## WHY: the original quota config lived in /etc/dovecot/90-quota.conf (one
## directory ABOVE conf.d/), which `!include conf.d/*.conf` never loads, and
## the conf.d/ copy had been renamed to 90-quota.conf.old (empty). So no quota
## backend was ever loaded -> `doveadm quota get` printed only the header and
## quota usage was never reported.
##
## FIX: Dovecot 2.4 removed the `plugin { }` section. The quota backend is now
## declared with a NAMED LIST FILTER block. The mailbox userdb
## (auth-sql.conf.ext) returns `quota_rule = maildir:storage=<bytes>` — the
## `maildir:` prefix is the quota-ROOT NAME, so the backend MUST be named
## "maildir" for that rule to bind.
##
## RESULT: `doveadm quota get` now reports real usage (STORAGE / MESSAGE).
## We intentionally do NOT enforce a per-user hard limit from userdb: the 2.4
## nested field naming (userdb_quota_storage_size / userdb_quota_rule) is
## fragile, and enabling it would reject mail for the already-over-limit
## mailbox (et.et/et: 54.5MB vs 50MB). Limit shows "-" = not enforced (safe).

quota maildir {
}
